providers:
  openai:
    type: openai
    apiKeyEnv: OPENAI_API_KEY
  anthropic:
    type: anthropic
    apiKeyEnv: ANTHROPIC_API_KEY
  google:
    type: gemini
    apiKeyEnv: GEMINI_API_KEY
  local:
    type: openai
    baseUrl: http://localhost:11434/v1

aliases:
  smart:
    policy: fallback
    chain:
      - anthropic/claude-sonnet-4-5
      - openai/gpt-4o
      - google/gemini-2.5-pro
  fast:
    policy: lowest_latency
    chain:
      - google/gemini-2.5-flash
      - openai/gpt-4o-mini
      - anthropic/claude-haiku-4-5
    cache:
      exact: auto
  cheap:
    policy: cheapest
    chain:
      - local/qwen2.5:7b
      - google/gemini-2.5-flash
      - openai/gpt-4o-mini
  faq:
    policy: fallback
    chain:
      - openai/gpt-4o-mini
      - google/gemini-2.5-flash
    cache:
      exact: on
      semantic: true
      ttlSeconds: 86400

server:
  requestTimeoutMs: 30000
  streamIdleMs: 30000
  maxRetries: 1

cache:
  exact:
    enabled: true
    ttlSeconds: 3600
  semantic:
    enabled: true
    threshold: 0.92
    embedder:
      type: local

rateLimit:
  defaultRpm: 120
  failureMode: open

circuitBreaker:
  failureThreshold: 5
  windowMs: 30000
  openMs: 20000

redaction:
  enabled: false

pricing:
  file: config/prices.yaml
