image:
  repository: tollgate
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

# Name of a Secret holding runtime configuration. Expected keys:
#   ADMIN_API_KEY, DATABASE_URL, REDIS_URL, KAFKA_BROKERS
# and any provider keys referenced by config.providers[*].apiKeyEnv
# (OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY).
# Optional: REDIS_VECTOR_URL, OTEL_EXPORTER_OTLP_ENDPOINT.
existingSecret: tollgate-secrets

logLevel: info

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 1

consumer:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

migrations:
  enabled: true

serviceMonitor:
  enabled: false
  interval: 15s

# Rendered into config/tollgate.yaml. See docs/configuration.md.
config:
  providers:
    openai:
      type: openai
      apiKeyEnv: OPENAI_API_KEY
    anthropic:
      type: anthropic
      apiKeyEnv: ANTHROPIC_API_KEY
    google:
      type: gemini
      apiKeyEnv: GEMINI_API_KEY
  aliases:
    smart:
      policy: fallback
      chain:
        - anthropic/claude-sonnet-4-5
        - openai/gpt-4o
        - google/gemini-2.5-pro
    fast:
      policy: lowest_latency
      chain:
        - google/gemini-2.5-flash
        - openai/gpt-4o-mini
        - anthropic/claude-haiku-4-5
  server:
    requestTimeoutMs: 30000
    streamIdleMs: 30000
    maxRetries: 1
  cache:
    exact:
      enabled: true
      ttlSeconds: 3600
    semantic:
      enabled: false
  rateLimit:
    defaultRpm: 120
    failureMode: open
  circuitBreaker:
    failureThreshold: 5
    windowMs: 30000
    openMs: 20000
  pricing:
    file: config/prices.yaml
